[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Core cryptography, OTP, and vault logic for Sentinel Authenticator."
license = "MIT"

[lib]
path = "src/lib.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# These overrides must have LOWER priority than pedantic/nursery so that
# they apply AFTER the group lints turn them on. Use -2.
expect_used = { level = "allow", priority = -2 }
panic = { level = "allow", priority = -2 }
module_inception = { level = "allow", priority = -2 }
missing_errors_doc = { level = "allow", priority = -2 }
missing_panics_doc = { level = "allow", priority = -2 }
missing_const_for_fn = { level = "allow", priority = -2 }

[lints.rust]
unsafe_code = "deny"
dead_code = "warn"
unused_imports = "warn"

[dependencies]
# ─── Cryptography ──────────────────────────────────────────────
aes-gcm = "0.10"
argon2 = "0.5"
subtle = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

# ─── Serialization ──────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# ─── Encoding / parsing ────────────────────────────────────────
data-encoding = "2"
url = "2"
regex = "1"

# ─── Error handling ────────────────────────────────────────────
thiserror = "2"

# ─── Google migration protobuf (M5) ────────────────────────────
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

# ─── Google migration protobuf compiler (M5) ───────────────────
[build-dependencies]
prost-build = "0.13"
