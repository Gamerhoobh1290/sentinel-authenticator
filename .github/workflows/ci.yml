# Sentinel Authenticator — continuous integration.
# Runs on every push and PR. Tests the cross-platform core crate (Linux) and
# the frontend (Linux). The Windows build is in release-windows.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # prost-build needs protoc; install it via the action below.
  PROTOC: /usr/local/bin/protoc

jobs:
  rust-core:
    name: Rust core (Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy -p sentinel-core --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p sentinel-core --all-targets

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo audit
        run: cargo audit --file Cargo.lock || true

  frontend:
    name: Frontend (Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Vite build
        run: npm run build
